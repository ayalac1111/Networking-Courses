lab:
  description: 'CST8371 Lab 09 (bonus) - Standard ACLs: follow the traffic (CML-Free)'
  notes: |-
    # Lab 09 — Standard ACLs: Follow the Traffic (Bonus, CML-Free)

    **Full lab text:** https://github.com/ayalac1111/Networking-Courses/blob/main/26f-cst8371/labs/l09-standard-acl-policies.md

    This is the short guide. The full instructions (placement reasoning, expected results, troubleshooting) are on the page above. Read it before you start.

    Optional bonus lab: 5 points, worth 1% of the course, added on top of 100%. Five nodes: **R1** and **R2** (routers), **PC1**, **PC2** and **SRV** (Alpine hosts). Consoles only. Addressing and OSPF are supplied.

    Login `admin` / `cisco`, enable secret `class` (hosts: `cisco` / `cisco`).

    The coloured groups on the canvas identify the networks: **Engineering** (PC1), **Accounting** (PC2), **Payroll** (SRV) and **Transit** (R1 and R2, the link between the routers).

    **C00 (0 pts):** find your U (Brightspace Grades, item U). Before starting any node, edit each Config tab: add `<username>-` to the hostname, and replace the `0` with your U on the 11 address lines. Start the lab, wait about three minutes, and prove OSPF is FULL and every host reaches every other host.

    **C01 (2 pts):** Accounting must not reach Payroll. Named standard ACL on R2. Follow a PC2 packet and a PC1 packet to SRV.

    **C02 (2 pts):** PC1 only must not reach Accounting. Named standard ACL on R1 using the `host` keyword. Follow PC1, SRV, and the reply from PC1 to PC2.

    **C03 (1 pt):** only PC1 may open a VTY session to R2. Named standard ACL, `access-class` on `line vty 0 4`.

    Evidence: paste each capture, with the device prompt and unedited output, under its device sub-header in `l09-c01-<username>.txt` to `l09-c03-<username>.txt`. Each checkpoint also asks for a one-line prediction and a one-line result.

    To pause: `write memory` on R1 and R2, then **Stop** the lab (never Wipe after C00).
  title: L09-Standard-ACLs
  version: 0.3.1
