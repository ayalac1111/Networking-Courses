  configuration:
  - name: ios_config.txt
    content: |-
      ! CST8371 Fall 2026 - Lab 09 (CML) baseline: R1. Addressing and OSPF, no ACLs. Supplied with U=0.
      hostname R1
      !
      no ip domain lookup
      ip domain name cst8371.net
      username admin privilege 15 secret cisco
      enable secret class
      !
      interface Ethernet0/0
       description Transit to R2
       ip address 198.18.0.1 255.255.255.252
       ip ospf network point-to-point
       no shutdown
      !
      interface Ethernet0/1
       description Engineering (PC1)
       ip address 198.18.0.33 255.255.255.240
       no shutdown
      !
      interface Ethernet0/2
       description Accounting (PC2)
       ip address 198.18.0.65 255.255.255.240
       no shutdown
      !
      router ospf 1
       router-id 1.1.1.1
       passive-interface Ethernet0/1
       passive-interface Ethernet0/2
       network 198.18.0.0 0.0.255.255 area 0
      !
      crypto key generate rsa modulus 2048
      ip ssh version 2
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
      line vty 0 4
       transport input telnet ssh
       login local
       exec-timeout 30 0
