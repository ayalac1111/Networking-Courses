lab:
  description: ''
  notes: |-
    # CST8371 — Week 1 Tool Readiness

    This small topology is for CML, Alpine, SSH, and x_remote onboarding.
    It is not a configuration exercise, apart from the rename and
    Loopback0 steps below. Do not otherwise change the supplied
    startup configuration.

    | Node | Address | Role |
    |---|---|---|
    | Alpine | eth0: 172.16.1.10/24 (static, to W01-EDGE) — eth1: DHCP (to EXTERNAL-Sw/EXTERNAL-Bridge) | Operations host |
    | W01-EDGE | Ethernet0/0: 172.16.1.1/24 (static, to Alpine) — Ethernet0/1: DHCP (to EXTERNAL-Sw/EXTERNAL-Bridge) | SSH target and collection target |
    | EXTERNAL-Sw | unmanaged switch | Bridges EXTERNAL-Bridge to one interface each on W01-EDGE and Alpine (CML links are point-to-point) |
    | EXTERNAL-Bridge | Assigned by CML host's real network | External connector in **BRIDGE** mode (System Bridge) — hands out a real, host-network DHCP address to anything bridged behind it, so you can reach W01-EDGE and Alpine directly from your own host machine and run x_remote from there |

    ## Student instructions

    1. **Before starting any node**, note the IP address your own host is
       using to reach this CML-Free web UI — that's the network
       EXTERNAL-Bridge will hand DHCP addresses out on.

    2. **Start all four nodes**: W01-EDGE, Alpine, EXTERNAL-Bridge, and
       EXTERNAL-Sw.

    3. **Verify interfaces before changing anything.**
       - On W01-EDGE:
         ```
         show ip int brief | ex una
         ```
         Ethernet0/0 is the static 172.16.1.1 internal link. Ethernet0/1
         should show a DHCP address on the same network you noted in
         step 1.
       - On Alpine:
         ```
         ip address
         ```
         eth0 is the static 172.16.1.10/24 internal link. eth1 should
         show a DHCP address on the same bridge network as W01-EDGE's
         Ethernet0/1.

    4. **Test connectivity.**
       - From your own host (not a console): `ping` both DHCP addresses,
         and `ssh admin@<device-DHCP-address>` (password `cisco`) to
         both W01-EDGE and Alpine.
       - From the Alpine console: `ping -c 2 172.16.1.1` should show
         2 packets transmitted, 2 received, 0% packet loss.

    5. **Run an x_remote collection from your host.** After downloading
       x_remote, edit the x_remote manifest (`l01-xremote.yaml`)
       and replace the `{W01-EDGE-DHCP-address}` and `{Alpine-DHCP-address}`
       placeholders with the DHCP-assigned addresses you verified in
       step 3, then run a collection against both devices.

    6. **Now make changes — start with W01-EDGE, then Alpine.**

       Rename W01-EDGE:
       ```
       W01-EDGE# configure terminal
       W01-EDGE(config)# hostname W01-EDGE-<username>
       W01-EDGE-<username>(config)# end
       ```

       Add a Loopback0 using your U value (find it in Brightspace Grades,
       grade item **U** — use it as-is, no calculation):
       ```
       W01-EDGE-<username># configure terminal
       W01-EDGE-<username>(config)# interface Loopback0
       W01-EDGE-<username>(config-if)# ip address 203.0.113.<U> 255.255.255.255
       W01-EDGE-<username>(config-if)# end
       ```
       Verify: `show ip interface brief | include Loopback0`

       Rename Alpine:
       ```
       hostname Alpine-<username>
       ```

    7. **Re-run the x_remote collection** (step 5) so it captures the
       rename and Loopback0 evidence, then submit per the lab
       instructions.
  title: L01-Tool-Readiness
  version: 0.3.0
