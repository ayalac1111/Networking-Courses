      - name: ios_config.txt
        content: |-
          ! CST8371 Fall 2026 — Week 1 CML readiness demo
          hostname W01-EDGE
          no ip domain lookup

          interface Ethernet0/0
           description TO-ALPINE
           ip address 172.16.1.1 255.255.255.0
           no shutdown

          interface Ethernet0/1
           description TO-NAT0-EXTERNAL
           ip address dhcp
           ip dhcp client broadcast-flag clear
           no shutdown

          ip domain name cst8371.local
          username admin privilege 15 secret cisco
          crypto key generate rsa modulus 2048
          ip ssh version 2

          line vty 0 4
           login local
           transport input ssh
           exec-timeout 10 0
          end
