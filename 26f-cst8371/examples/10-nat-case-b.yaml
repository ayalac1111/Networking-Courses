      ! CST8371 Fall 2026 - Week 10 NAT guided practice Case B: ISP. Outside the NAT domain.
      hostname ISP
      !
      no ip domain lookup
      ip domain name cst8371.local
      username admin privilege 15 secret cisco
      enable secret class
      !
      vrf definition MGMT
       address-family ipv4
       exit-address-family
      !
      interface Ethernet0/0
       description MGMT-TO-BRIDGE0
       vrf forwarding MGMT
       ip address dhcp
       ip dhcp client broadcast-flag clear
       no shutdown
      !
      interface Ethernet0/1
       description TO-EDGE-OUTSIDE
       ip address 203.0.113.254 255.255.255.0
       ip access-group BLOCK-RESERVED in
       no shutdown
      !
      interface Ethernet0/2
       description TO-SERVER-OUTSIDE-HOST
       ip address 192.0.2.254 255.255.255.0
       no shutdown
      !
      ip access-list standard BLOCK-RESERVED
       deny 10.0.0.0 0.255.255.255
       deny 172.16.0.0 0.15.255.255
       deny 192.168.0.0 0.0.255.255
       deny 169.254.0.0 0.0.255.255
       deny 127.0.0.0 0.255.255.255
       permit any
      !
      crypto key generate rsa modulus 2048
      ip ssh version 2
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
      line vty 0 4
       login local
       transport input ssh
       exec-timeout 30 0
      end
