lab:
  description: CST8371 Week 10 guided practice - NAT Case B (CML-Free)
  notes: |-
    # NAT-Case-B (CML-Free)

    Week 10 guided practice. **Not graded.** Presenter sheet: `NAT-Cases-Guide.md`.

    **Nodes.** Five counted nodes: EDGE and ISP (routers), PC-A, PC-B and SERVER (Alpine hosts). LAN-A, LAN-B, EXTERNAL-Sw and EXTERNAL-Bridge are not counted. Stop any other running lab first.

    Login: routers `admin` / `cisco`, enable secret `class`. Hosts `admin` / `cisco`. Wait about three minutes after Start.

    ## Read the diagram

    - **Inside (left, green):** two private LANs with different ranges. LAN-A `192.168.100.0/25` (PC-A, two addresses) and LAN-B `172.16.100.0/28` (PC-B).
    - **Orange label:** the NAT rule on EDGE and the design it should produce.
    - **Outside (right, blue):** ISP and SERVER `192.0.2.69`. The ISP drops private source addresses (ACL `BLOCK-RESERVED`, inbound on `Ethernet0/1`).
    - Zones are ordinary rectangles: select and move or resize them.

    ## Tags

    | Tag | Nodes | Meaning |
    |---|---|---|
    | `inside` | PC-A, PC-B, LAN-A, LAN-B | Private side |
    | `nat-lan` | PC-A | LAN selected for NAT |
    | `no-nat-lan` | PC-B | LAN not selected for NAT |
    | `outside` | ISP, SERVER | Public side |
    | `test-host` | SERVER | The one external test node |
    | `nat-boundary` | EDGE | NAT router |
    | `mgmt` | EXTERNAL-Bridge, EXTERNAL-Sw | Management, bridge0, not NAT |

    ## Tests

    From PC-A (default address `.10`): `ping -c 3 192.0.2.69`, `wget -q -O - -T 3 http://192.0.2.69/`.
    Evidence on EDGE: `show ip nat translations`, `show ip nat statistics`. On ISP: `show access-lists BLOCK-RESERVED`.
