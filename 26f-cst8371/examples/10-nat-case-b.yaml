    content: |-
      # this is a shell script which will be sourced at boot
      # CST8371 Fall 2026 - Week 10 NAT guided practice Case B: PC-A (inside host on LAN-A)
      hostname PC-A
      # configurable user account
      USERNAME=admin
      PASSWORD=cisco

      # data interface
      ip addr add 192.168.100.10/25 dev eth0
      ip addr add 192.168.100.11/25 dev eth0
      ip link set eth0 up

      # default route is set BEFORE the management DHCP so the data gateway stays the default
      ip route add default via 192.168.100.126

      # management interface (external connector, bridge0): DHCP from the real network
      ip link set eth1 up
      udhcpc -i eth1 -b
      # never let the management network become the default path
      ip route del default dev eth1 2>/dev/null || true

