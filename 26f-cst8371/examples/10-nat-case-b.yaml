  configuration:
  - name: ios_config.txt
    content: |-
      ! CST8371 Fall 2026 - Week 10 NAT guided practice Case B: EDGE (NAT router).
      hostname EDGE
      !
      no ip domain lookup
      ip domain name cst8371.local
      username admin privilege 15 secret cisco
      enable secret class
      !
      vrf definition MGMT
       address-family ipv4
       exit-address-family
      !
      interface Ethernet0/0
       description MGMT-TO-BRIDGE0
       vrf forwarding MGMT
       ip address dhcp
       ip dhcp client broadcast-flag clear
       no shutdown
      !
      interface Ethernet0/1
       description TO-ISP-OUTSIDE
       ip address 203.0.113.100 255.255.255.0
       ip nat outside
       no shutdown
      !
      interface Ethernet0/2
       description LAN-A-192.168.100.0/25
       ip address 192.168.100.126 255.255.255.128
       ip nat inside
       no shutdown
      !
      interface Ethernet0/3
       description LAN-B-172.16.100.0/28
       ip address 172.16.100.14 255.255.255.240
       no shutdown
      !
      ip route 0.0.0.0 0.0.0.0 203.0.113.254
      !
      ip nat inside source static 192.168.100.10 209.165.200.226
      !
      crypto key generate rsa modulus 2048
      ip ssh version 2
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
      line vty 0 4
       login local
       transport input ssh
       exec-timeout 30 0
      end
