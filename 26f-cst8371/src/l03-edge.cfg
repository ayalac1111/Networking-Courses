! CST8371 Fall 2026 — Foundation Lab 03 (SLAAC and NDP)
! C. Ayala
! EDGE template. Before applying:
!   1. Replace {device-hostname} with {username}-EDGE
!   2. Replace every U below with your assigned value
!   3. Add Gi0/0/1's own configuration yourself — see the placeholder
!      below. It is not provided; C01 asks you to write it, using
!      Gi0/0/0's configuration as your model.
!
hostname {device-hostname}
!
no ip domain-lookup
enable secret class
!
service timestamps log datetime msec
!
line console 0
 logging synchronous
!
! SSH access needs a domain name and a local username/secret in place
! before a key pair can be generated — order matters here.
ip domain-name cst8371.local
username admin secret cisco
crypto key generate rsa modulus 1024
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
!
! Enables IPv6 forwarding between interfaces. Without this, EDGE holds
! IPv6 addresses but never forwards a packet from one interface to
! another — every checkpoint from here on depends on it.
ipv6 unicast-routing
!
! Gi0/0/0 — transit toward the remote gateway/TFTP server. Provided as
! a worked model for Gi0/0/1 below. Kept shutdown here; you bring it up
! at C05, not before.
interface GigabitEthernet0/0/0
 description Transit-to-Remote
 ipv6 address fe80::U link-local
 ipv6 address 2001:fab:203::U/64
 shutdown
!
! Gi0/0/1 — VM LAN, the Router Advertisement source. NOT configured
! here — write this interface yourself, following the same shape as
! Gi0/0/0 above, but:
!   - use the VM LAN addressing from B2 (2010:acad:U:aa::U/64, fe80::U)
!   - end with "no shutdown", not "shutdown" — VM can't discover
!     anything on a down interface
!
! Default route toward the remote gateway. One route covers everything
! beyond EDGE, including the TFTP server — there is no separate route
! to the TFTP network specifically. Fully specified (names the
! outgoing interface, not just the next hop) even though the next hop
! here is a GUA: this makes the route unambiguous the moment Gi0/0/0
! comes up, rather than depending on a separate lookup for the next
! hop first. Because Gi0/0/0 is still shut down, this route will not
! appear in the routing table until C05 brings that interface up; it
! not appearing yet is expected, not a fault.
ipv6 route ::/0 GigabitEthernet0/0/0 2001:fab:203::254
!
end
